[project]
name = "app-sentinel-backend"
version = "0.1.0"
description = "Agentic mobile application security assessment platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.2.3",
    "procrastinate==3.10.0",
    "pydantic==2.12.0",
    "pydantic-settings==2.15.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "httpx==0.28.1",
    "weasyprint==62.3",
    "pydyf==0.10.0",
]

[dependency-groups]
dev = [
    "ruff==0.9.2",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
